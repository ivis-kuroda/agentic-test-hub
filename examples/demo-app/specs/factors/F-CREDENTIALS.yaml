id: F-CREDENTIALS
name: credentials
description: what the request presents as proof that it may send
path: context.headers.Authorization
levels:
  - id: L-VALID
    name: valid
    value: Bearer {{env.DEMO_TOKEN}}
    absent: false
  - id: L-WRONG
    name: wrong
    value: Bearer not-a-real-token
    absent: false
  - id: L-ABSENT
    name: not sent
    absent: true
