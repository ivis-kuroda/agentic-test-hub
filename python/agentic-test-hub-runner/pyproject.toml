[project]
name = "agentic-test-hub-runner"
version = "0.0.0"
description = "Runs a resolved test case or scenario and judges the result — the Python-generated-test counterpart to @agentic-test-hub/runner."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "httpx>=0.27", "playwright>=1.45"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.15", "ty>=0.0.80"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_test_hub_runner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
