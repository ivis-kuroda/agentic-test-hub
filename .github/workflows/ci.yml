name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  Lint:
    # Static checks over packages/*, examples/*, scripts and root configs —
    # everything that runs on the node directly, without a bundler. apps/*
    # gets its own job: a Nuxt project needs its own tools for some of this
    # (see the Apps job below), and keeping the two apart means a failure
    # here is never "which half broke, packages or the app".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each check is its own step so a red build says which one objected
      # without anyone opening the log.
      - name: Formatting
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint:packages

      - name: Types
        run: pnpm typecheck:packages

      - name: The hub must not name a specific target
        run: pnpm lint:no-target-coupling

      - name: Specifications are in canonical form
        run: pnpm specs:check

      - name: Specifications hold together
        run: pnpm specs:validate

  Apps:
    # Static checks for apps/* (currently apps/hub, a Nuxt project). Split
    # out because a Nuxt app needs its own type checker: a standalone one
    # cannot resolve Nuxt and Nitro's virtual module graph (#build/*,
    # auto-imported server globals). As more apps are added, extend this
    # job's steps rather than adding new top-level jobs per app.
    # Runtime tests for apps/hub are not repeated here: the Test job already
    # covers them, since apps/hub is registered as a project in the root
    # vitest config alongside packages/*.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:apps

      - name: Types
        # nuxi typecheck, wrapping vue-tsc — the tool built for a Nuxt
        # project's virtual modules and .vue SFCs, in place of oxlint here.
        run: pnpm typecheck:apps

  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Direct execution of TypeScript is what removes the build step, so
          # the runtime version is load-bearing rather than incidental.
          node-version-file: .node-version
          cache: pnpm

      # Asserted rather than printed for a human to notice. Direct execution
      # of TypeScript is what removes the build step, so a runner silently
      # falling back to an older major would quietly change what is tested.
      - name: Require the pinned runtime
        run: |
          node --version
          node --eval "
            const major = Number(process.versions.node.split('.')[0]);
            if (major < 26) {
              console.error(\`expected node >= 26, got \${process.versions.node}\`);
              process.exit(1);
            }
          "

      - run: pnpm install --frozen-lockfile

      - name: Unit and integration tests
        run: pnpm test

  E2E:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only the browser this suite uses, with the system libraries it needs.
      # chromium.launch() in packages/runner/src/driver/playwright.ts is
      # called without a `channel`, and Playwright's default headless
      # launch in that case runs chrome-headless-shell, not full Chromium
      # — confirmed the hard way: adding --no-shell here once broke every
      # E2E test with "Executable doesn't exist at
      # .../chromium_headless_shell-.../chrome-headless-shell". So the
      # shell binary is installed, not skipped.
      # Caching the browser binary itself was considered and rejected:
      # most of this step's time is apt installing system libraries via
      # --with-deps, which reruns on every job regardless of any binary
      # cache (github-hosted runners are ephemeral), so a cache would only
      # shave a few seconds off the download while adding a real risk of
      # running against a stale or corrupted cached browser.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      # Kept only when something failed, where the trace and screenshots are
      # worth their size.
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
