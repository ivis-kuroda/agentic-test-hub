name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each check is its own step so a red build says which one objected
      # without anyone opening the log.
      - name: Formatting
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: The hub must not name a specific target
        run: pnpm lint:no-target-coupling

      - name: Specifications are in canonical form
        run: pnpm specs:check

      - name: Specifications hold together
        run: pnpm specs:validate

  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Direct execution of TypeScript is what removes the build step, so
          # the runtime version is load-bearing rather than incidental.
          node-version-file: .node-version
          cache: pnpm

      # Asserted rather than printed for a human to notice. Direct execution
      # of TypeScript is what removes the build step, so a runner silently
      # falling back to an older major would quietly change what is tested.
      - name: Require the pinned runtime
        run: |
          node --version
          node --eval "
            const major = Number(process.versions.node.split('.')[0]);
            if (major < 26) {
              console.error(\`expected node >= 26, got \${process.versions.node}\`);
              process.exit(1);
            }
          "

      - run: pnpm install --frozen-lockfile

      - name: Unit and integration tests
        run: pnpm test

  E2E:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only the browser this suite uses, with the system libraries it needs.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      # Kept only when something failed, where the trace and screenshots are
      # worth their size.
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
